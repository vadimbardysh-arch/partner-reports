const BANDS = [
  {id:'all', label:'Усі дистанції'},
  {id:'near', label:'до 2 км'},
  {id:'mid', label:'2–5 км'},
  {id:'far', label:'від 5 км'},
];

function bandOf(km) {
  if (km == null) return 'na';
  if (km < 2) return 'near';
  if (km < 5) return 'mid';
  return 'far';
}

const onVenues = new Set(DATA.venues.map(v => v.id));
let band = 'all';
let zoneOn = true;
const map = L.map('map', { zoomControl: true, minZoom: 11, maxZoom: 16 });
const BASEMAP_BOUNDS = [[49.66762782262193, 23.7744140625], [49.95121990866204, 24.2138671875]];
const baked = L.imageOverlay('lviv-basemap.jpg', BASEMAP_BOUNDS, {
  opacity: 1,
  attribution: '&copy; OpenStreetMap'
});
const osmDe = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
});
baked.addTo(map);
L.control.layers(
  { 'Карта Львова': baked, 'Онлайн-підкладка': osmDe },
  {},
  { collapsed: true }
).addTo(map);

map.createPane('zones');
map.getPane('zones').style.zIndex = 350;
const dropLayer = L.layerGroup().addTo(map);
const restLayer = L.layerGroup().addTo(map);
const ringLayer = L.layerGroup().addTo(map);
const zoneGroup = L.featureGroup();
(DATA.zones || []).forEach(z => {
  L.polygon(z.coords, {
    pane: 'zones',
    color: '#111827',
    weight: 2,
    fillColor: '#111827',
    fillOpacity: 0.22,
    interactive: true
  }).bindPopup(
    '<div class="popup"><b>' + (z.short || z.name) + '</b><br>Зона доставки Bolt Food у Львові</div>'
  ).addTo(zoneGroup);
});

const venueById = Object.fromEntries(DATA.venues.map(v => [v.id, v]));

function fmtKm(km) {
  return km == null ? 'н/д' : km.toFixed(2).replace('.', ',') + ' км';
}

function renderHeader() {
  document.getElementById('period').textContent =
    DATA.period + ' · Львів · ' + DATA.total + ' доставлених замовлень';
  document.getElementById('stats').innerHTML =
    '<span>Середня дистанція <b>' + DATA.avgKm.toString().replace('.', ',') + ' км</b></span>' +
    '<span>до 2 км <b>' + DATA.bands.near + '</b></span>' +
    '<span>2–5 км <b>' + DATA.bands.mid + '</b></span>' +
    '<span>від 5 км <b>' + DATA.bands.far + '</b></span>';

  document.getElementById('venue-chips').innerHTML = DATA.venues.map(v =>
    '<label class="chip" data-id="' + v.id + '">' +
      '<span class="dot" style="background:' + v.color + '"></span>' +
      '<input type="checkbox" checked data-id="' + v.id + '">' +
      v.short + ' (' + v.n + ')' +
    '</label>'
  ).join('') +
    '<label class="chip" id="zone-chip">' +
      '<span class="dot" style="background:#111827;border-radius:2px;"></span>' +
      '<input type="checkbox" id="zone-toggle" checked>' +
      'Зона Львова' +
    '</label>';

  document.getElementById('band-pills').innerHTML = BANDS.map(b =>
    '<button class="pill' + (b.id === band ? ' active' : '') + '" data-band="' + b.id + '">' + b.label + '</button>'
  ).join('');

  document.getElementById('legend').innerHTML =
    '<b>Як читати карту</b><br>' +
    'Сірі полігони — зони доставки Bolt Food у Львові (максимальне покриття).<br>' +
    'Колір точки = заклад. Ромб = адреса ресторану.<br>' +
    'Кільця 2 / 4 / 6 / 8 км з’являються, коли увімкнено один заклад.';
}

function visiblePoints() {
  return DATA.points.filter(p => {
    if (!onVenues.has(p.pid)) return false;
    if (band === 'all') return true;
    return bandOf(p.km) === band;
  });
}

function drawRings() {
  ringLayer.clearLayers();
  if (onVenues.size !== 1) return;
  const v = venueById[[...onVenues][0]];
  [2000,4000,6000,8000].forEach((m, i) => {
    L.circle([v.lat, v.lng], {
      radius: m, color: v.color, weight: 1, opacity: 0.45,
      dashArray: '6 6', fill: false
    }).addTo(ringLayer);
  });
}

function fitMap(pts) {
  if (zoneOn && zoneGroup.getLayers().length) {
    map.fitBounds(zoneGroup.getBounds(), { padding: [24,24], maxZoom: 13 });
    return;
  }
  if (!pts.length) return;
  const b = L.latLngBounds(pts.map(p => [p.lat, p.lng]));
  DATA.venues.forEach(v => { if (onVenues.has(v.id)) b.extend([v.lat, v.lng]); });
  map.fitBounds(b, { padding: [30,30], maxZoom: 14 });
}

function drawZone() {
  if (zoneOn) {
    if (!map.hasLayer(zoneGroup)) zoneGroup.addTo(map);
  } else if (map.hasLayer(zoneGroup)) {
    map.removeLayer(zoneGroup);
  }
}

function draw(fit) {
  dropLayer.clearLayers();
  restLayer.clearLayers();
  const pts = visiblePoints();
  pts.forEach(p => {
    const v = venueById[p.pid];
    L.circleMarker([p.lat, p.lng], {
      radius: 6, color: '#fff', weight: 1, fillColor: v.color, fillOpacity: 0.88
    }).bindPopup(
      '<div class="popup"><b>' + v.name + '</b><br>' +
      p.d + ' · ' + p.r + '<br>Дистанція: ' + fmtKm(p.km) + '</div>'
    ).addTo(dropLayer);
  });
  DATA.venues.forEach(v => {
    if (!onVenues.has(v.id)) return;
    const icon = L.divIcon({
      className: '',
      html: '<div style="width:16px;height:16px;background:' + v.color +
            ';transform:rotate(45deg);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)"></div>',
      iconSize: [16,16], iconAnchor: [8,8]
    });
    L.marker([v.lat, v.lng], { icon, zIndexOffset: 1000 })
      .bindPopup('<div class="popup"><b>' + v.name + '</b><br>Заклад</div>')
      .addTo(restLayer);
  });
  drawRings();
  drawZone();
  if (fit) fitMap(pts);
}

renderHeader();
draw(true);

document.getElementById('venue-chips').addEventListener('change', (e) => {
  if (e.target.id === 'zone-toggle') {
    zoneOn = e.target.checked;
    e.target.closest('.chip').classList.toggle('off', !zoneOn);
    draw(true);
    return;
  }
  const id = Number(e.target.getAttribute('data-id'));
  if (e.target.checked) onVenues.add(id); else onVenues.delete(id);
  e.target.closest('.chip').classList.toggle('off', !e.target.checked);
  draw(false);
});
document.getElementById('band-pills').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-band]');
  if (!btn) return;
  band = btn.getAttribute('data-band');
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p === btn));
  draw();
});
</script>
</body>
</html>
